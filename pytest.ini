[pytest]
minversion = 8.0
testpaths = tests
pythonpath = src
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts = -ra --strict-markers --strict-config
xfail_strict = true
markers =
    slow: marks tests that take longer than usual (deselect with '-m "not slow"')
    integration: marks tests that cross an application boundary
    from_collection_hook: attached by the collection hook demonstration
